name: Build Native Python Daftar Khayati APK

on:
  push:
    branches:
      - build/daftar-khayati-python-native
    paths:
      - "apps/daftar-khayati-python/**"
      - ".github/workflows/build-daftar-khayati-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for tests and Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          # ubuntu-22.04 hosted runners already provide the Android build toolchain dependencies.
          # Fail early with a readable diagnostic if a required host tool is unavailable.
          gcc --version
          git --version
          zip -v | head -n 1
          unzip -v | head -n 1
          cmake --version
          autoconf --version | head -n 1
          pkg-config --version
          test -f /usr/include/ffi.h || test -f /usr/include/x86_64-linux-gnu/ffi.h
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36 arabic-reshaper python-bidi

      - name: Verify Python source and ledger tests
        working-directory: apps/daftar-khayati-python
        run: |
          python -m compileall -q main.py ledger.py tests
          python -m unittest discover -s tests -v

      - name: Build native Android APK
        working-directory: apps/daftar-khayati-python
        run: buildozer -v android debug

      - name: Verify APK file
        working-directory: apps/daftar-khayati-python
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          echo "APK built: $APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-khayati-python-native-apk
          path: apps/daftar-khayati-python/bin/*.apk
          if-no-files-found: error
          retention-days: 14
